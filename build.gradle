plugins {
    id 'java'
}

group = 'com.server'
version = '1.2.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 本地 lib/ 目录的 API JAR（compileOnly，不打包进发行 JAR）
    compileOnly fileTree(dir: 'lib', include: ['paper-api.jar', 'papi.jar', 'luckperms-api.jar', 'gson.jar', 'bungee-chat.jar', 'adventure-api.jar', 'adventure-key.jar', 'examination-api.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debugOptions.debugLevel = 'lines,source'
}

jar {
    archiveFileName = "StatTracker-${version}.jar"
}