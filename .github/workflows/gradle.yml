name: Publish Java Package with Gradle

on:
  release:
    types: [created]
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the JAR to (e.g. v1.2.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build with Gradle
      run: ./gradlew build
    - name: Upload JAR to Release
      if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
      run: |
        TAG="${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}"
        if [ -z "$TAG" ]; then echo "no tag provided, skipping upload"; exit 0; fi
        gh release upload "$TAG" build/libs/*.jar --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
