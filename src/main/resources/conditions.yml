# StatTracker Conditions
# Define conditions that evaluate player stats to true/false.
# Other plugins can read results via %statcond_<id>% (true/false) or Java API.
#
# Supported types: COUNTER, DOUBLE, SET_SIZE, SET_CONTAINS, BOOLEAN
# Operators: >=, <=, ==, >, <, !=
# Optional field: permission - when the condition is met, the bridge grants
# this permission (e.g. cyutitles.obtain.<title>), and revokes it when not met.
# Optional field: revoke-command - run this console command when the condition
# flips from met to not met (e.g. remove the granted title). Placeholders:
# %player% (player name), %uuid% (player UUID).
# Optional field: requires - combined condition, all sub items must pass (AND).
# Each item is a condition id (string) or an inline stat check (map).

conditions:
  # Example: mining_master
  # mining_master:
  #   display: "Mining Master"
  #   type: COUNTER
  #   key: "mining.mat.STONE"
  #   operator: ">="
  #   value: 10000
  #   permission: "cyutitles.obtain.mining_master"
  #
  # Example: explorer
  # explorer:
  #   display: "Explorer"
  #   type: SET_SIZE
  #   key: "movement.biomes"
  #   operator: ">="
  #   value: 20
  #
  # Example: has_nether
  # has_nether:
  #   display: "Nether Visitor"
  #   type: BOOLEAN
  #   key: "dimension.nether"
  #   operator: "=="
  #   value: 1
  #
  # Example: set_contains
  # visited_plains:
  #   display: "Plains Visitor"
  #   type: SET_CONTAINS
  #   key: "movement.biomes"
  #   operator: "=="
  #   contains: "PLAINS"
  #
  # Example: combined condition (requires)
  # jack_of_all:
  #   display: "Master of All"
  #   permission: "cyutitles.obtain.jack_of_all"
  #   revoke-command: "cyutitles take %player% jack_of_all"
  #   requires:
#     - "mining_master"
#     - "explorer"
#     - {type: COUNTER, key: "fishing.caught", operator: ">=", value: 500}
#
# Example: no armor kill count
# no_armor_slayer:
#   display: "Bare Hands Slayer"
#   type: COUNTER
#   key: "combat.no_armor_kills"
#   operator: ">="
#   value: 10
#   permission: "cyutitles.obtain.no_armor_slayer"
