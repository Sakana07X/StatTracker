name: StatTracker
version: 1.2.1
main: com.server.stattracker.StatTrackerPlugin
api-version: 1.13
folia-supported: true
author: Sakana
softdepend: [PlaceholderAPI, LuckPerms, TrChat, PlayerTitle, Vault]
description: 轻量级高性能玩家行为追踪框架 — 兼容 Bukkit/Spigot/Paper/Folia，27 个追踪器

commands:
  stattracker:
    description: StatTracker 命令
    usage: /stattracker reload
    permission: stattracker.reload
    aliases: [st]

permissions:
  stattracker.reload:
    description: 重载 StatTracker 配置与条件
    default: op
