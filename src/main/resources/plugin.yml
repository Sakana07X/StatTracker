name: StatTracker
version: 1.2.4
main: com.server.stattracker.StatTrackerPlugin
api-version: 1.13
folia-supported: true
author: Sakana
softdepend: [PlaceholderAPI, LuckPerms, TrChat, PlayerTitle, Vault]
description: Lightweight high-performance player behavior tracker - compatible with Bukkit/Spigot/Paper/Folia, 28+ trackers

commands:
  stattracker:
    description: StatTracker commands
    usage: /stattracker <subcommand>
    permission: stattracker.admin
    aliases: [st]

permissions:
  stattracker.admin:
    description: StatTracker admin commands
    default: op