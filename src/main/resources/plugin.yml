name: StatTracker
version: 1.2.3
main: com.server.stattracker.StatTrackerPlugin
api-version: 1.13
folia-supported: true
author: Sakana
softdepend: [PlaceholderAPI, LuckPerms, TrChat, PlayerTitle, Vault]
description: 轻量级高性能玩家行为追踪框架 — 兼容 Bukkit/Spigot/Paper/Folia，28 个追踪器

commands:
  stattracker:
    description: StatTracker 命令
    usage: /stattracker <子命令>
    permission: stattracker.admin
    aliases: [st]

permissions:
  stattracker.admin:
    description: StatTracker 管理命令
    default: op
